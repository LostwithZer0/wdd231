<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 180 120"
     role="img"
     aria-label="DH developer logo">

  <!-- Midnight navy background -->
  <rect width="180" height="120"
        rx="16"
        fill="#162437"/>

  <!-- Gold code brackets -->
  <path d="M42 35 L20 60 L42 85
           M138 35 L160 60 L138 85"
