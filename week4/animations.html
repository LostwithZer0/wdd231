<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 231 CSS animations and transitions learning activity.">
    <title>CSS Animations and Transitions</title>
    <link rel="stylesheet" href="styles/animations.css">
</head>

<body>
    <header>
        <h1>CSS Animations and Transitions</h1>
    </header>

    <main>
        <section>
            <h2>Loading Animation</h2>
            <p>This loader spins continuously.</p>
            <div class="loader" role="img" aria-label="Animated loading gear"></div>
        </section>

        <section>
            <h2>Hover Transition</h2>
            <p>Hover over the circle to activate the transition.</p>
            <div class="loader-t" role="img" aria-label="Gear that animates when hovered"></div>
        </section>
    </main>

    <footer>
        <p>WDD 231 | Week 04 Learning Activity</p>
    </footer>
</body>

</html>
